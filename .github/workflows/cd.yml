# CD do banco. As credenciais do AWS Academy rotacionam a cada Start Lab;
# atualize os secrets AWS_* antes de cada execucao (runbook
# aws-academy-setup.md no repo postech-sw-arch-p3-docs).
#
# homolog: plan (dry-run). main: apply -auto-approve. Ambos compartilham o
# state remoto; nao execute Terraform local enquanto este workflow rodar.
name: CD

on:
  push:
    branches: [homolog, main]

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: us-east-1
  TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

jobs:
  plan:
    if: github.ref == 'refs/heads/homolog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: plan
        run: |
          terraform init -input=false
          terraform plan -input=false

  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: apply
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
